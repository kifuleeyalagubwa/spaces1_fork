{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">
                {% if object %}Update Education Level{% else %}Create New Education Level{% endif %}
            </h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 
                        {% if object %}Update Level{% else %}Create Level{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // Dynamic parent level filtering
    $("#id_system").change(function() {
        const systemId = $(this).val();
        const url = "{% url 'create_level' %}";
        
        if (systemId) {
            $.get(url, {'system_id': systemId}, function(data) {
                $("#id_parent").html(data);
            });
        } else {
            $("#id_parent").html('<option value="">---------</option>');
        }
    });
});
</script>
{% endblock %}
